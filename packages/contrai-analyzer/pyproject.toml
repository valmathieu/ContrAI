[project]
name = "contrai-analyzer"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.3",
    "pandas<3",
    "plotly>=6.6.0",
    "streamlit>=1.40.0",
]

# ``main.py`` is the Streamlit entry script and sits at the package root, so
# point setuptools at src/ rather than letting flat-layout discovery guess.
[tool.setuptools.packages.find]
where = ["src"]
