[project]
name = "contrai-scraper"
version = "0.5.0"
description = "Playwright spectator-mode scraper for online Contrée games"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "contrai-core",
    "contrai-data",
    "playwright>=1.57.0",
    "tzdata>=2026.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4",
  "pytest-cov>=6.0"
]

[project.scripts]
contrai-scrape = "contrai_scraper.cli:main"

# The importable package lives under src/; nothing at the package root ships.
[tool.setuptools.packages.find]
where = ["src"]
