[project]
name = "contrai-scraper"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "nest-asyncio>=1.6.0",
    "playwright>=1.57.0",
]

[project.scripts]
contrai-scrape = "contrai_scraper.cli:main"

# ``run.py`` is a parked login experiment sitting at the package root; pointing
# setuptools at src/ keeps flat-layout discovery from trying to package it.
[tool.setuptools.packages.find]
where = ["src"]
